version: '3.8'

services:
  noomercy-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noomercy-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
