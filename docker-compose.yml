version: '3.8'

networks:
  icontainer-network:
    external: true

services:
  noomercy-bot:
    image: ghcr.io/kasuminho/vampir-noomercy:latest
    container_name: noomercy-bot
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    env_file:
      - icontainer.env
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
    networks:
      - icontainer-network
    volumes:
      # Persistência de dados locais de fallback/logs na VPS
      - /srv/noomercy-bot/data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
